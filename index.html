    <!-- Au-delà de 1920 px, la page entière grossit en proportion de l'écran (jusqu'à ×2). -->
    <script>
      (function () {
        var root = document.documentElement;
        function setZoom() {
          var width = root.clientWidth || window.innerWidth;
          root.style.setProperty('--page-zoom', Math.min(2, Math.max(1, width / 1920)).toFixed(4));
        }
        setZoom();
        window.addEventListener('resize', setZoom);
        document.addEventListener('DOMContentLoaded', setZoom);
      })();
    </script>
