    <!--
      Au-delà de 1600 px de large, la page entière grossit en proportion de l'écran (jusqu'à ×2,4).
      Le grossissement est aussi limité par la hauteur, pour qu'un écran très bas montre encore un projet.
      Quand la page n'occupe plus toute la largeur, data-capped active les prolongements de styles/wide.css.
    -->
    <script>
      (function () {
        var BASE = 1600, MAX = 2.4, MIN_HEIGHT = 760;
        var root = document.documentElement;
        function setZoom() {
          var width = root.clientWidth || window.innerWidth;
          var height = window.innerHeight || width;
          var zoom = Math.max(1, Math.min(MAX, width / BASE, height / MIN_HEIGHT));
          root.style.setProperty('--page-zoom', zoom.toFixed(4));
          if (BASE * zoom < width - 1) root.dataset.capped = 'true';
          else delete root.dataset.capped;
        }
        setZoom();
        window.addEventListener('resize', setZoom);
        document.addEventListener('DOMContentLoaded', setZoom);
      })();
    </script>

    <title>Tom Lefevre-Bonzon — Développeur</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
